[project]
name = "rung-cli"
version = "0.2.0"
description = "An opinionated verification ladder for software written with coding agents: architecture rules, runtime evidence, properties, TLA+ and Lean, and an evidence ledger that expires when code changes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["verification", "lean", "tla+", "formal-methods", "coding-agents", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/CalQuity/rung"
Documentation = "https://github.com/CalQuity/rung/tree/main/docs"
Issues = "https://github.com/CalQuity/rung/issues"

[project.scripts]
rung = "rung.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pre-commit>=4",
    "hypothesis>=6.170.14",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rung"]

# The source distribution carries what is needed to build, test and read Rung, not the repository's
# own CI, verdicts or local caches.
[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "docs/", "skills/", ".claude-plugin/", "README.md", "CHANGELOG.md", "LICENSE",
           "SECURITY.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", "pyproject.toml", "uv.lock"]
exclude = ["examples/*/.rung/", "**/__pycache__/", "**/.lake/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The TLA+ normalizer maps Unicode operators to ASCII; its comments show the glyphs on purpose.
"src/rung/drafting/tla.py" = ["RUF003"]

[tool.pyright]
# Editors (Pylance, basedpyright) read this too, so they check the project the way CI does.
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.coverage.run]
source = ["rung"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true
