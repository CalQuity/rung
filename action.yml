name: Rung
description: Re-run verification checks under reviewed policy and write a merge report.
branding:
  icon: check-square
  color: green

inputs:
  checks:
    description: Space-separated check ids to run (default all declared checks).
    default: ""
  comment:
    description: Post or update a pull request comment with the report. Requires a write token.
    default: "false"
  package:
    description: What to install with `uv tool install`. Empty installs the version of this action itself.
    default: ""
  working-directory:
    description: Directory containing rung.toml.
    default: "."
  upload-evidence:
    description: >-
      Upload .rung/evidence/ (screenshots, videos, traces, HARs and each run's index.html) as a workflow
      artifact, and link it from the report.
    default: "false"
  policy-paths:
    description: >-
      More files that decide the gate, space-separated project-relative globs (e.g. a semgrep rules file a
      scan check uses). rung.toml, LAWS.md, waivers, baselines and gitleaks/semgrep ignore files are always
      included. Ignored when the base revision's rung.toml sets [gate] policy_paths.
    default: ""
  policy-changes:
    description: >-
      What to do when the pull request edits what decides the gate (rung.toml, LAWS.md, waivers,
      baselines, scanner configs, workflows): "fail" blocks before running checks, "warn" runs anyway.
      Ignored when the base revision's rung.toml sets [gate] policy_changes. The base [gate]
      approval_label (default rung-policy-approved), applied by a maintainer, approves policy changes.
    default: "fail"
  require-coverage:
    description: >-
      Space-separated project-relative globs that require an execution check when changed. Ignored when
      the base revision's rung.toml sets [gate] require_coverage.
    default: ""
  pr-head:
    description: >-
      The commit the checkout must be, or a merge commit of. The gate blocks otherwise (for example a
      pull_request_target run that checked out the base). Empty skips the check.
    default: ${{ github.event.pull_request.head.sha }}
  executor:
    description: Where to run PR checks. Choose local or daytona.
    default: "local"
  daytona-snapshot:
    description: Reviewed Daytona snapshot with Rung and the project's offline toolchain installed.
    default: ""

outputs:
  passed:
    description: '"true" when every selected check passed.'
    value: ${{ steps.check.outputs.passed }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Install Rung
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        ACTION_PATH: ${{ github.action_path }}
        EXECUTOR: ${{ inputs.executor }}
        SNAPSHOT: ${{ inputs.daytona-snapshot }}
        UPLOAD_EVIDENCE: ${{ inputs.upload-evidence }}
        BASE_REF: ${{ github.base_ref }}
        UV_NO_CONFIG: "1"
      run: |
        extra=()
        case "$EXECUTOR" in
          local)
            if [ -n "$SNAPSHOT" ]; then
              echo "daytona-snapshot requires executor: daytona" >&2; exit 2
            fi
            ;;
          daytona)
            if [ -z "$SNAPSHOT" ] || [ -z "$BASE_REF" ] || [ "$UPLOAD_EVIDENCE" = "true" ]; then
              echo "Daytona requires a PR base and daytona-snapshot, with upload-evidence disabled" >&2
              exit 2
            fi
            extra+=(--with daytona==0.227.3)
            ;;
          *) echo "executor must be local or daytona" >&2; exit 2 ;;
        esac
        unset DAYTONA_API_KEY
        if [ "$EXECUTOR" = "daytona" ]; then cd "$RUNNER_TEMP"; fi
        uv tool install "${PACKAGE:-$ACTION_PATH}" "${extra[@]}"

    - name: Prepare Bubblewrap for isolated checks
      if: runner.os == 'Linux' && inputs.executor == 'local'
      shell: bash
      run: |
        # Drafted and `isolate = true` evidence checks run under Bubblewrap on Linux.
        if ! command -v bwrap > /dev/null && command -v apt-get > /dev/null && sudo -n true 2> /dev/null; then
          sudo -n apt-get install -y -qq bubblewrap > /dev/null || true
        fi
        if ! command -v bwrap > /dev/null; then
          echo "::notice::Bubblewrap is not installed; isolated evidence checks will report an error."
          exit 0
        fi
        probe() { bwrap --die-with-parent --unshare-all --ro-bind / / --proc /proc --dev /dev /usr/bin/true 2> /dev/null; }
        if probe; then exit 0; fi
        # Ubuntu 23.10+ lets AppArmor block unprivileged user namespaces. A GitHub-hosted runner is a
        # single-use VM, so lifting the restriction there affects only this job.
        restricted=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2> /dev/null || echo 0)
        if [ "$restricted" = "1" ] && [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
          sudo -n sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        fi
        if ! probe; then
          echo "::notice::Bubblewrap cannot create user namespaces on this runner; isolated evidence checks will report an error. See Rung's README (In CI)."
        fi

    - name: Run checks
      id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BASE_REF: ${{ github.base_ref }}
        CHECKS: ${{ inputs.checks }}
        POLICY_PATHS: ${{ inputs.policy-paths }}
        POLICY_CHANGES: ${{ inputs.policy-changes }}
        REQUIRE_COVERAGE: ${{ inputs.require-coverage }}
        EXECUTOR: ${{ inputs.executor }}
        SNAPSHOT: ${{ inputs.daytona-snapshot }}
        PR_HEAD: ${{ inputs.pr-head }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        EVENT_ACTION: ${{ github.event.action }}
        EVENT_LABEL: ${{ github.event.label.name }}
        REPO: ${{ github.repository }}
        LABEL_TOKEN: ${{ github.token }}
      run: |
        case "$POLICY_CHANGES" in
          fail|warn) ;;
          *) echo "policy-changes must be fail or warn" >&2; exit 2 ;;
        esac
        command=check
        args=()
        if [ -n "$BASE_REF" ]; then
          # Rung compares with the merge base, so the history back to it must be present. Never
          # truncate history; deepen a shallow checkout instead (use fetch-depth: 0 to skip this).
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --unshallow origin
          fi
          if ! git rev-parse --verify --quiet "origin/$BASE_REF" > /dev/null; then
            git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          fi
          command=gate
          args+=(--base "origin/$BASE_REF")
          read -ra extra <<< "$POLICY_PATHS"
          for path in "${extra[@]}"; do args+=("--policy-path=$path"); done
          read -ra coverage <<< "$REQUIRE_COVERAGE"
          for path in "${coverage[@]}"; do args+=("--require-coverage=$path"); done
          if [ "$POLICY_CHANGES" = "warn" ]; then args+=(--allow-policy-changes); fi
          if [ -n "$PR_HEAD" ]; then args+=("--pr-head=$PR_HEAD"); fi
          # Approval counts only on the run a maintainer starts by applying the label, so a later push
          # needs a fresh approval. The label must still be on the pull request (a re-run of an old run
          # after the label was removed does not count). Rung compares it with the base's approval_label.
          if [ "$EVENT_ACTION" = "labeled" ] && [ -n "$EVENT_LABEL" ] && [ -n "$PR_NUMBER" ]; then
            if GH_TOKEN="$LABEL_TOKEN" gh api "repos/$REPO/issues/$PR_NUMBER/labels" --paginate --jq '.[].name' \
              2> /dev/null | grep -qxF -- "$EVENT_LABEL"; then
              args+=("--pr-label=$EVENT_LABEL")
            else
              echo "Could not confirm the applied label through the GitHub API; policy approval is not applied." >&2
            fi
          fi
          if [ "$EXECUTOR" = "daytona" ]; then
            args+=(--executor daytona "--daytona-snapshot=$SNAPSHOT")
          fi
        fi
        read -ra ids <<< "$CHECKS"
        # Hide step credentials and file-command paths from repository commands. This avoids
        # accidental use only: in local mode, PR code runs as the runner user and can still reach the
        # runner's files and processes. The pass/fail decision is this step's own exit code below.
        if (
          unset GITHUB_ENV GITHUB_PATH GITHUB_OUTPUT GITHUB_STEP_SUMMARY GITHUB_STATE
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          unset GH_TOKEN GITHUB_TOKEN LABEL_TOKEN
          if [ "$EXECUTOR" != "daytona" ]; then unset DAYTONA_API_KEY; fi
          rung "$command" "${args[@]}" -- "${ids[@]}"
        ) > "$RUNNER_TEMP/rung-gate.txt" 2>&1; then
          code=0
        else
          code=$?
        fi
        token=$(python3 -I -c 'import secrets; print(secrets.token_hex(16))')
        printf '::stop-commands::%s\n' "$token"
        cat "$RUNNER_TEMP/rung-gate.txt"
        printf '::%s::\n' "$token"
        if [ "$code" -eq 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi
        echo "code=$code" >> "$GITHUB_OUTPUT"
        # Fail here, in the step that ran the gate, rather than trusting a later step.
        if [ "$code" -ne 0 ]; then
          echo "Rung gate failed (exit $code). See the output above."
          exit "$code"
        fi

    # The steps below run after repository code. They publish the result; they never decide it.
    - name: Reject symlinks in evidence before uploading
      id: symlinks
      if: always() && inputs.upload-evidence == 'true' && steps.check.outcome != 'skipped'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -L .rung ] || [ -L .rung/evidence ]; then
          echo "The evidence directory must be inside the project." >&2
          exit 1
        fi
        if [ -d .rung/evidence ] && [ -n "$(find .rung/evidence -type l -print -quit)" ]; then
          echo "Refusing to upload evidence containing symlinks." >&2
          exit 1
        fi

    - name: Upload evidence
      id: evidence
      if: always() && inputs.upload-evidence == 'true' && steps.symlinks.outcome == 'success'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: rung-evidence
        path: ${{ inputs.working-directory }}/.rung/evidence/
        if-no-files-found: ignore
        include-hidden-files: true

    - name: Write report
      id: report
      if: always() && steps.check.outcome != 'skipped'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        EXECUTOR: ${{ inputs.executor }}
      run: |
        if [ "$EXECUTOR" = "daytona" ]; then
          printf '<!-- rung-report -->\n## Rung merge gate · Daytona\n' > "$RUNNER_TEMP/rung-report.md"
        else
          unset DAYTONA_API_KEY
          rung report --evidence-url "$EVIDENCE_URL" > "$RUNNER_TEMP/rung-report.md"
        fi
        if [ -s "$RUNNER_TEMP/rung-gate.txt" ]; then
          {
            echo
            echo '### Gate execution'
            echo
            sed 's/^/    /' "$RUNNER_TEMP/rung-gate.txt"
          } >> "$RUNNER_TEMP/rung-report.md"
        fi
        cat "$RUNNER_TEMP/rung-report.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Post or update the pull request comment
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request' && steps.report.outcome == 'success'
      # A comment that cannot be posted (a forked PR's read-only token) must not fail the gate.
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- rung-report -->"))) | .id' \
          | head -n 1)
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F "body=@$RUNNER_TEMP/rung-report.md" > /dev/null
        else
          gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/rung-report.md"
        fi
