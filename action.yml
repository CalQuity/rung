name: Rung
description: Run Rung checks on a pull request, gate on what it introduces, and post one sticky report comment.
branding:
  icon: check-square
  color: green

inputs:
  checks:
    description: Space-separated check ids to run (default all checks touched by the change).
    default: ""
  comment:
    description: Post or update a pull request comment with the report.
    default: "true"
  package:
    description: What to install with `uv tool install`. Empty installs the version of this action itself.
    default: ""
  working-directory:
    description: Directory containing rung.toml.
    default: "."
  policy-paths:
    description: >-
      More files that decide the gate, space-separated (e.g. a semgrep rules file a scan check uses).
      rung.toml, LAWS.md, waivers, baselines and gitleaks/semgrep ignore files are always included.
    default: ""
  policy-changes:
    description: >-
      What to do when the pull request edits what decides the gate (rung.toml, LAWS.md, waivers,
      baselines, scanner configs): "warn" lists them in the report, "fail" also fails the gate.
    default: "warn"

outputs:
  passed:
    description: '"true" when every selected check passed.'
    value: ${{ steps.check.outputs.passed }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Install Rung
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        ACTION_PATH: ${{ github.action_path }}
      run: uv tool install "${PACKAGE:-$ACTION_PATH}"

    - name: Run checks
      id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BASE_REF: ${{ github.base_ref }}
        CHECKS: ${{ inputs.checks }}
      run: |
        args=()
        if [ -n "$BASE_REF" ]; then
          # Rung compares with the merge base, so the history back to it must be present. Never
          # truncate history; deepen a shallow checkout instead (use fetch-depth: 0 to skip this).
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --unshallow origin
          fi
          if ! git rev-parse --verify --quiet "origin/$BASE_REF" > /dev/null; then
            git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          fi
          args+=(--changed --base "origin/$BASE_REF")
        fi
        read -ra ids <<< "$CHECKS"
        set +e
        rung check "${ids[@]}" "${args[@]}"
        code=$?
        if [ "$code" -eq 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi
        echo "code=$code" >> "$GITHUB_OUTPUT"

    - name: Flag policy changes
      id: policy
      if: github.base_ref != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BASE_REF: ${{ github.base_ref }}
        POLICY_PATHS: ${{ inputs.policy-paths }}
      run: |
        # The PR's own rung.toml, waivers and baselines decide its gate, so a reviewer must see edits to them.
        read -ra extra <<< "$POLICY_PATHS"
        changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- rung.toml LAWS.md .rung/waivers.toml \
          .rung/baselines .gitleaks.toml .gitleaksignore .semgrep.yml .semgrepignore "${extra[@]}")
        if [ -n "$changed" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
          while read -r file; do echo "::warning file=$file::This pull request changes what decides the Rung gate"; done <<< "$changed"
          {
            echo "### Policy files changed in this pull request"
            echo
            echo "These decide what the gate checks and accepts; review them like code:"
            echo
            while read -r file; do echo "- \`$file\`"; done <<< "$changed"
            echo
          } > "$RUNNER_TEMP/rung-policy.md"
        fi

    - name: Write report
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        rung report > "$RUNNER_TEMP/rung-report.md"
        if [ -f "$RUNNER_TEMP/rung-policy.md" ]; then cat "$RUNNER_TEMP/rung-policy.md" >> "$RUNNER_TEMP/rung-report.md"; fi
        cat "$RUNNER_TEMP/rung-report.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Post or update the pull request comment
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      # A comment that cannot be posted (a forked PR's read-only token) must not fail the gate.
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- rung-report -->"))) | .id' \
          | head -n 1)
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F "body=@$RUNNER_TEMP/rung-report.md" > /dev/null
        else
          gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/rung-report.md"
        fi

    - name: Gate
      if: steps.check.outputs.passed != 'true' || (inputs.policy-changes == 'fail' && steps.policy.outputs.changed == 'true')
      shell: bash
      env:
        CODE: ${{ steps.check.outputs.code }}
        PASSED: ${{ steps.check.outputs.passed }}
      run: |
        if [ "$PASSED" = "true" ]; then
          echo "The pull request changes Rung policy files and policy-changes is \"fail\". See the report above."
        else
          echo "Rung checks failed (exit $CODE). See the report above."
        fi
        exit 1
