[project]
name = "rung"

[llm]
provider = "none"
model = ""
base_url = ""
api_key_env = "RUNG_API_KEY"

[[check]]
id = "tests"
kind = "command"
run = "uv run pytest -q"
covers = ["src/**", "tests/**", "examples/**", "pyproject.toml"]

[[check]]
id = "lint"
kind = "command"
run = "uv run ruff check ."
covers = ["src/**/*.py", "tests/**/*.py", "pyproject.toml"]

[[check]]
id = "types"
kind = "command"
run = "uv run pyright"
covers = ["src/**/*.py", "pyproject.toml"]

[[check]]
id = "format"
kind = "command"
run = "uv run ruff format --check ."
covers = ["src/**/*.py", "tests/**/*.py", "pyproject.toml"]

[[check]]
id = "secrets"
kind = "scan"
tool = "gitleaks"
covers = []

[[check]]
id = "vulnerable-deps"
kind = "scan"
tool = "osv-scanner"
covers = []

[[check]]
id = "workflows"
kind = "scan"
tool = "zizmor"
covers = []

[[check]]
id = "deps"
kind = "deps"
min_age_days = 30
covers = []

[[check]]
id = "shortcuts"
kind = "shortcuts"
covers = []
