name: rung

# Rung checks its own pull requests with its own action.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  rung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install the scanners Rung's own checks use
        run: uv tool install zizmor
      - uses: ./
        with:
          # The test suite already runs in ci.yml; gitleaks and osv-scanner run locally.
          checks: lint format workflows deps
