name: rung

# Rung checks its own pull requests with its own action.
on:
  pull_request:

permissions:
  contents: read

jobs:
  rung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - name: Install the scanners Rung's own checks use (pinned versions)
        run: |
          uv tool install zizmor==1.31.1
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: ./
        with:
          # Exercise this pull request's local action, including changes to Rung policy itself.
          policy-changes: warn
      - name: Prepare synthetic evidence fixture
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          fixture="$RUNNER_TEMP/rung-evidence-fixture"
          mkdir "$fixture"
          cd "$fixture"
          git init -qb main
          cat > rung.toml <<'EOF'
          [[check]]
          id = "fixture"
          kind = "evidence"
          run = "python3 drive.py"
          require = [".txt"]
          EOF
          cat > drive.py <<'PY'
          import os
          from pathlib import Path
          evidence = Path(os.environ["RUNG_EVIDENCE_DIR"])
          (evidence / "synthetic.txt").write_text("Synthetic Rung CI fixture\n")
          PY
          printf '.rung/\n' > .gitignore
          git add .
          git -c user.name=Fixture -c user.email=fixture@example.invalid commit -qm baseline
          git update-ref "refs/remotes/origin/$BASE_REF" HEAD
      - name: Run gate and upload synthetic evidence
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/rung-evidence-fixture
          upload-evidence: true
      - name: Check evidence link in report
        run: grep -Eq 'Download the recordings.*actions/runs/' "$RUNNER_TEMP/rung-report.md"
