name: rung

# Rung checks its own pull requests with its own action.
on:
  pull_request:

permissions:
  contents: read

jobs:
  rung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - name: Install the scanners Rung's own checks use (pinned versions)
        run: |
          uv tool install zizmor==1.31.1
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: ./
        with:
          # Exercise this pull request's local action, including changes to Rung policy itself.
          policy-changes: warn
