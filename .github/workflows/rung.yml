name: rung

# Rung checks its own pull requests. The merge decision uses the action as reviewed on the base
# branch, so a pull request cannot relax the gate that judges it. A second job exercises this pull
# request's own action on a synthetic fixture.
on:
  pull_request:
    # `labeled` lets a maintainer approve reviewed policy changes with the base's approval label;
    # `unlabeled` re-runs the gate without it, so removing the label withdraws the approval.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the reviewed base action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - name: Install the scanners Rung's own checks use (pinned versions)
        run: |
          uv tool install zizmor==1.31.1
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Policy changes block (the default) unless a maintainer applies the approval label.
      - uses: ./base
        with:
          working-directory: pr

  action:
    # Exercises this pull request's action end to end. It is not the merge decision.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare synthetic evidence fixture
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          fixture="$RUNNER_TEMP/rung-evidence-fixture"
          mkdir "$fixture"
          cd "$fixture"
          git init -qb main
          cat > rung.toml <<'EOF'
          [[check]]
          id = "fixture"
          kind = "evidence"
          run = "python3 drive.py"
          require = [".txt"]
          EOF
          cat > drive.py <<'PY'
          import os
          from pathlib import Path
          evidence = Path(os.environ["RUNG_EVIDENCE_DIR"])
          (evidence / "synthetic.txt").write_text("Synthetic Rung CI fixture\n")
          PY
          printf '.rung/\n' > .gitignore
          git add .
          git -c user.name=Fixture -c user.email=fixture@example.invalid commit -qm baseline
          git update-ref "refs/remotes/origin/$BASE_REF" HEAD
      - name: Run gate and upload synthetic evidence
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/rung-evidence-fixture
          upload-evidence: true
          # The fixture is its own repository, not this pull request's checkout.
          pr-head: ""
      - name: Check evidence link in report
        run: grep -Eq 'Download the recordings.*actions/runs/' "$RUNNER_TEMP/rung-report.md"
